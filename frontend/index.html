<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drip</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Stamps the theme before first paint, so a slow Pi never flashes cream
         on its way into the night theme. Mirrors lib/theme.ts - keep in step. -->
    <script>
      (function () {
        var c;
        try {
          c = localStorage.getItem("drip-theme");
        } catch (e) {}
        if (c !== "light" && c !== "dark") {
          c = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = c;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
